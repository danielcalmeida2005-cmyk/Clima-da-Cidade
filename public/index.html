<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <title>Clima</title>
</head>

<body>
    <main>
        <aside>

            
   <a href="" class="vento">
                    <i class="fa-solid fa-wind"></i>
                </a>

            <div class="caixa_menu">

                <div class="opcao-menu">
                    <button class="Historico">
                        <i class="fa-solid fa-cloud"></i>
                        <span>
                           historico
                        </span>
                    </button>
                </div>

                <div class="opcao-menu">
                    <button class="option">
                        <i class="fa-solid fa-map-location-dot"></i>
                        <span>
                          Salva
                        </span>
                    </button>
                </div>

                <div class="opcao-menu">
                    <button class="maps">
                        <i class="fa-regular fa-map"></i>
                        <span>
                            Maps
                        </span>
                    </button>
                </div>




                <div class="opcao-menu">
                    <button class="settings">
                       <i class="fa-solid fa-gear"></i>
                        <span>
                            Settings
                        </span>
                    </button>
                </div>
            </div>
        </aside>

        <section class="container">
            <div class="background">


                <input type="text" placeholder="Search your city">

            <i class="fa-solid fa-magnifying-glass"></i>


           

            </div>
            <div class="infor-Cidade">

                <div class="resultado">
                    <div class="Nome-Cidade">
                        <h2>
                            Cidade
                        </h2>
                        <p class="Probali">


                            


                        </p>
                    </div>
                    <h3 class="Graus">
                   
                    </h3>
                </div>

            </div>

            <div class="painel">

                <p>Today</p>
                <div class="cards">

                </div>

             
<div class="cards">
    
</div>

            </div>

            <div class="painel Details">
          
<div class="weather-details-card">
 
  <div class="detail-item">
    <div class="detail-icon">
      <i class="ph ph-thermometer-simple"></i> 
    </div>
    <div class="detail-info">
      <span class="label">Real Feel</span>
      <strong class="value feel_like">30°</strong>
    </div>
  </div>

 
  <div class="detail-item">
    <div class="detail-icon">
      <i class="ph ph-wind"></i>
    </div>
    <div class="detail-info">
      <span class="label">wind</span>
      <strong class="value speedWind">0.2 <small>Km/h</small></strong>
    </div>
  </div>

 
  <div class="detail-item">
    <div class="detail-icon">
      <i class="ph ph-cloud-rain"></i>
    </div>
    <div class="detail-info">
      <span class="label">Chance of Rain</span>
      <strong class="value PorcetagemDeChuva">0%</strong>
    </div>
  </div>



                    

   
  </div>



            </div>
        </section>

        <section class="conteudo">
            <h2>Historico</h2>
    <div class="historico-container">


    </div>
</section>
    </main>

    <script src="logical.js"></script>
</body>

</html>
