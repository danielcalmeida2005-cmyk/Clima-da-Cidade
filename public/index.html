<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <main>
        <aside>

            
   <a href="" class="vento">
                    <i class="fa-solid fa-wind"></i>
                </a>

            <div class="caixa_menu">

             
           

                <div class="opcao-menu">
                    <a href="">
                        <i class="fa-solid fa-cloud"></i>
                        <span>
                            Clima
                        </span>
                    </a>
                </div>



                <div class="opcao-menu">
                    <a href="">
                        <i class="fa-solid fa-cloud"></i>
                        <span>
                            Opcoes
                        </span>
                    </a>
                </div>

                <div class="opcao-menu">
                    <a href="">
                        <i class="fa-regular fa-map"></i>
                        <span>
                            Maps
                        </span>
                    </a>
                </div>

                <div class="opcao-menu">
                    <a href="">
                       <i class="fa-solid fa-gear"></i>
                        <span>
                            Settings
                        </span>
                    </a>
                </div>
            </div>
        </aside>

        <section class="container">
            <div class="background">
                <input type="text" placeholder="Pesquisa sua cidade">
            <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <div class="infor-Cidade">

                <div class="resultado">
                    <div class="Nome-Cidade">
                        <h2>
                            Cidade
                        </h2>
                        <p class="Probali">
                            Chance de chuva,pai:0%
                        </p>
                    </div>
                    <h3 class="Graus">
                        50
                    </h3>
                </div>

            </div>

            <div class="painel">
                <p>Hoje</p>
<div class="cards">
    
</div>
            </div>

            <div class="painel">
                <div class="codicoes">

                   

                    
<div class="weather-details-card">
  <!-- Item 1: Sensação Térmica -->
  <div class="detail-item">
    <div class="detail-icon">
      <i class="ph ph-thermometer-simple"></i> <!-- Exemplo com Phosphor Icons ou FontAwesome -->
    </div>
    <div class="detail-info">
      <span class="label">Real Feel</span>
      <strong class="value feel_like">30°</strong>
    </div>
  </div>

  <!-- Item 2: Vento -->
  <div class="detail-item">
    <div class="detail-icon">
      <i class="ph ph-wind"></i>
    </div>
    <div class="detail-info">
      <span class="label">Vento</span>
      <strong class="value speedWind">0.2 <small>Km/h</small></strong>
    </div>
  </div>

 
  <div class="detail-item">
    <div class="detail-icon">
      <i class="ph ph-cloud-rain"></i>
    </div>
    <div class="detail-info">
      <span class="label">Chance de Chuva</span>
      <strong class="value PorcetagemDeChuva">0%</strong>
    </div>
  </div>

  <!-- Item 4: Índice UV -->
  <div class="detail-item">
    <div class="detail-icon">
      <i class="ph ph-sun"></i>
    </div>
    <div class="detail-info">
      <span class="label">Índice UV</span>
      <strong class="value">0</strong>
    </div>
  </div>


            </div>
        </section>
    </main>

    <script src="logical.js"></script>
</body>

</html>
