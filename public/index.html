<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="style.css">
    <title>login</title>
</head>

<body>
    <main>
        <section class="login">
            <h1>Login</h1>

            <form action="">
                <div class="campoInput">
                    <label for="">Email</label>
                    <div class="input email">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="Email@123.com">
                    </div>
                </div>
                <div class="campoInput">
                    <label for="">Password</label>
                    <div class="input senha">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Senha123">    
                    </div>
                    <a href="#">Forgot password</a>
                </div>
            </form>

            <div class="campoButton">
                <button class="enviar">Sign In <i class="fa-solid fa-arrow-right"></i></button>
                
            </div>
            <p class="continue">
                Or continue with
            </p>
            <div class="altenative">
                <button>
                    <i class="fa-brands fa-google"></i>
                    Google
                </button>
                <button>
                    <i class="fa-brands fa-github"></i>
                    GitHub
                </button>
            </div>
            <p class="create">Don`t have an account? <a href="../public/auth/create_account/create.html">Sign up</a></p>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
