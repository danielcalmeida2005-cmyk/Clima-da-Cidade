<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <main>
        <aside>


            <a href="" class="vento">
                <i class="fa-solid fa-wind"></i>
            </a>

            <div class="caixa_menu">




                <div class="opcao-menu">
                    <a href="">
                        <i class="fa-solid fa-cloud"></i>
                        <span>
                            Clima
                        </span>
                    </a>
                </div>



                <div class="opcao-menu">
                    <a href="">
                       <i class="fa-solid fa-ellipsis"></i>
                        <span>
                            Opcoes
                        </span>
                    </a>
                </div>

                <div class="opcao-menu">
                    <a href="">
                        <i class="fa-regular fa-map"></i>
                        <span>
                            Maps
                        </span>
                    </a>
                </div>

                <div class="opcao-menu">
                    <a href="">
                        <i class="fa-solid fa-gear"></i>
                        <span>
                            Settings
                        </span>
                    </a>
                </div>
            </div>
        </aside>

        <section class="container">
            <div class="background">
                <input type="text" placeholder="Search your city">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <div class="infor-Cidade">

                <div class="resultado">
                    <div class="Nome-Cidade">
                        <h2>
                            <!-- City -->
                        </h2>
                        <p class="Probali">

                        </p>
                    </div>
                    <h3 class="Graus">
                        <!-- 50 -->
                    </h3>
                </div>

            </div>

            <div class="painel">
                <p>Today</p>
                <div class="cards">

                </div>
            </div>

            <div class="painel Details">

                <div class="weather-details-card">

                    <div class="detail-item">
                        <div class="detail-icon">
                            <i class="fa-solid fa-temperature-three-quarters"></i>
                        </div>
                        <div class="detail-info">
                            <span class="label">Real Feel</span>
                            <strong class="value feel_like">30°</strong>
                        </div>
                    </div>


                    <div class="detail-item">
                        <div class="detail-icon">
                            <i class="fa-solid fa-wind"></i>
                        </div>
                        <div class="detail-info">
                            <span class="label">wind</span>
                            <strong class="value speedWind"> <small>Km/h</small></strong>
                        </div>
                    </div>


                    <div class="detail-item">
                        <div class="detail-icon">
                            <i class="fa-solid fa-cloud-rain"></i>
                        </div>
                        <div class="detail-info">
                            <span class="label">Chance of Rain</span>
                            <strong class="value PorcetagemDeChuva"></strong>
                        </div>
                    </div>


                    <div class="detail-item">
                        <div class="detail-icon">
                          <i class="fa-solid fa-sun"></i>
                        </div>
                        <div class="detail-info">
                            <span class="label">UV Index</span>
                            <strong class="value">0</strong>
                        </div>
                    </div>


                </div>
        </section>
    </main>

    <script src="logical.js"></script>
</body>

</html>
