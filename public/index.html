<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        crossorigin="anonymous" referrerpolicy="no-referrer" />
        
        <link rel="stylesheet" href="style.css">
    <title>login</title>

<body>
    <main>
 
        <section class="login">
<div class="imagemdesktop">
    <img src="https://i.pinimg.com/736x/7f/39/f2/7f39f24222d01233cd9465b3d904aad7.jpg" alt="">
</div>
            <div class="container">
                 <h1>Login</h1>

            <form action="">
                <div class="campoInput">
                    <label for="">Email</label>
                    <div class="input email">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="Email@123.com">
                    </div>
                </div>
                <div class="campoInput">
                    <label for="">Password</label>
                    <div class="input senha">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Senha123">    
                    </div>
                   
                </div>
            </form>
 <a href="https://api-clima-ijt0.onrender.com/auth/forgot/forgot.html">Forgot password</a>
 
            <div class="campoButton">
                <button class="enviar">Sign In <i class="fa-solid fa-arrow-right"></i></button>
                
            </div>
            <p class="continue">
                Or continue with
            </p>
            <div class="altenative">
                <button>
                    <i class="fa-brands fa-google"></i>
                    Google
                </button>
                <button>
                    <i class="fa-brands fa-github"></i>
                    GitHub
                </button>
            </div>
            <p class="create">Don`t have an account? <a href="https://api-clima-ijt0.onrender.com/auth/create_account/create.html">Sign up</a></p>
        
            </div>
           </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
