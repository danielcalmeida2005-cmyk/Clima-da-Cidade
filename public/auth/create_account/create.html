    <main>
        <section class="containerPai">
           <div class="imagemdesktop">
   
</div>

            <div class="container">
                
                <h1>Create account</h1>
                <form action="">
                    <div class="campoInput">
                        <label for="">Email</label>
                        <div class="input email">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="email" placeholder="Email@123.com">
                        </div>
                    </div>
                    <div class="campoInput">
                        <label for="">Password</label>
                        <div class="input senha">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" placeholder="Senha123">
                        </div>
                
                    </div>
                    
                      </form> 
                       <div class="checkbox">
    <input type="checkbox" id="termos">
    <label for="termos">Aceito os <a href="https://api-clima-ijt0.onrender.com/auth/politicas/politicas.html#termos">termos</a>  e <a href="https://api-clima-ijt0.onrender.com/politicas.html/#Diretrizes">diretrizes</a> </label>
</div>
           
                <div class="campoButton">
                    <button class="enviar">Sign In <i class="fa-solid fa-arrow-right"></i></button>
                
                </div>
                <p class="create">Already have an account? <a href="https://api-clima-ijt0.onrender.com/index.html">Login</a></p>
            </div>
        </section>
